name: Auto Release Docker

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # Setup Go + Swagger
      # =========================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger
        run: swag init

      # =========================
      # Prepare Swagger UI
      # =========================
      - name: Prepare Swagger UI
        run: |
          mkdir -p public
          cp docs/swagger.json public/swagger.json

          cat <<EOF > public/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8" />
            <title>API Docs</title>
            <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css" />
          </head>
          <body>
            <div id="swagger-ui"></div>

            <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>

            <script>
              SwaggerUIBundle({
                url: './swagger.json',
                dom_id: '#swagger-ui',
                deepLinking: true,
              });
            </script>
          </body>
          </html>
          EOF

      # =========================
      # Deploy Swagger to Pages
      # =========================
      - name: Deploy Swagger to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      # =========================
      # Fixed Version
      # =========================
      - name: Set Version
        id: version
        run: |
          echo "NEW_TAG=0.6.0" >> $GITHUB_OUTPUT

      # =========================
      # Create Git Tag
      # =========================
      - name: Create Tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git tag -f ${{ steps.version.outputs.NEW_TAG }}
          git push origin ${{ steps.version.outputs.NEW_TAG }} --force

      # =========================
      # Docker Login
      # =========================
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # =========================
      # Docker Build & Push
      # =========================
      - name: Build and Push Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            adamilkom00/unpaklinkback:${{ steps.version.outputs.NEW_TAG }}
            adamilkom00/unpaklinkback:latest
